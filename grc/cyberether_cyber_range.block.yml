id: cyberether_cyber_range
label: CyberEther Range
category: '[cyberether]'
flags: [ show_id, python ]

parameters:
- id: label
  label: Label
  dtype: string
  hide: ${ ('none' if label else 'part') }

- id: value
  label: Default Value
  dtype: float
  default: '50'

- id: start
  label: Start
  dtype: float
  default: '0'

- id: stop
  label: Stop
  dtype: float
  default: '100'

- id: gui_hint
  label: GUI Hint
  dtype: string
  default: '""'
  hide: part

value: ${ value }

asserts:
- ${start <= value <= stop}
- ${start <= stop}

templates:
  imports: from gnuradio import cyberether
  var_make: self.${id} = ${id} = ${value}
  callbacks:
  - self.set_${id}(${value})
  make: |-
    <%
        range_ = 'self._%s_range'%id
    %>\
    ${range_} = cyberether.cyber_range("${no_quotes(label, id)}", ${start}, ${stop}, ${value}, ${gui_hint})
    ${range_}.set_callback(self.set_${id})

documentation: |-
  A slider rendered inside the CyberEther window that drives a flowgraph
  variable, like QT GUI Range does for Qt flowgraphs. Leave the label blank
  to use the variable id as the label.

  GUI Hint places the control panel in the shared window grid, qtgui-style:
  "row, col" or "row, col, row_span, col_span" (zero-based cells). Leave
  empty to auto-place.

file_format: 1
