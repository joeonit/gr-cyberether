name: release (windows)

# Windows is the one platform with no local machine to test on, so this is
# driven by hand for now. Deliberately NOT wired to tag pushes yet: until a
# manual run goes green end to end, a tag would attach a failed job to the
# release. Add the `push: tags: v*` trigger back once it passes.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CYBERETHER_REF: "v1.9.1"
  # Pinned to match CyberEther's own Windows CI at v1.9.1.
  VULKAN_VERSION: 1.4.309.0
  VULKAN_SDK_SHA256: 48b132169b64fe65cdb0f20970195335a65354e73f1ea5373032c2a8bbad4297

jobs:
  release-windows:
    name: gr-cyberether-windows-x86_64
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # nasm + winflexbison3 + pkgconfiglite are what CyberEther's own Windows
      # build needs; without them meson fails resolving its subprojects.
      - name: Install system dependencies
        shell: pwsh
        run: choco install nasm winflexbison3 pkgconfiglite -y --no-progress

      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          activate-environment: grcyberether

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          # GNU Radio 3.10 in conda-forge uses pybind11 internals ABI v5.
          # Keep the OOT binding on the same pybind11 generation.
          conda install -y cmake ninja pkg-config gnuradio "pybind11=2.13" boost-cpp
          pip install "meson>=1.11" PyYAML numpy mapbox_earcut

      - name: Cache CyberEther
        id: ce-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ce-prefix
          key: cyberether-release-${{ env.CYBERETHER_REF }}-windows-v3-superluminal-export

      # CyberEther renders through Vulkan on Windows, so the SDK has to be
      # present at build time. Mirrors CyberEther's own install step.
      #
      # Deliberately NOT gated on the CyberEther cache: jetstream's public
      # headers include <vulkan/vulkan.h>, so gr-cyberether needs the SDK to
      # compile even when libjetstream itself is restored from cache.
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $installerPath = Join-Path $pwd 'vulkan-sdk.exe'
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkan-sdk.exe" -OutFile $installerPath

          $sha = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $env:VULKAN_SDK_SHA256) {
            throw "Unexpected Vulkan SDK SHA256: $sha"
          }

          Start-Process -FilePath $installerPath -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait

          $sdkRoot = "C:\VulkanSDK\$env:VULKAN_VERSION"
          if (!(Test-Path $sdkRoot)) {
            throw "Vulkan SDK was not installed to $sdkRoot"
          }

          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdkRoot\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # VULKAN_SDK alone is not enough: MSVC resolves #include <vulkan/vulkan.h>
          # off the INCLUDE variable, so the SDK's Include/Lib must be on it
          # explicitly or the compile fails with C1083.
          "INCLUDE=$sdkRoot\Include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$sdkRoot\Lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build CyberEther
        if: steps.ce-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          # Run under PowerShell so ilammy's MSVC link.exe takes priority
          # over conda's Git-for-Windows link.exe
          git clone --depth 1 --branch "$env:CYBERETHER_REF" `
            https://github.com/luigifcruz/CyberEther.git ce-src

          # CyberEther v1.9.1 omits its DLL export annotation from the public
          # Superluminal class. Patch only the CI checkout until that one-line
          # fix is available in a tagged CyberEther release.
          $header = Join-Path $pwd 'ce-src/include/jetstream/superluminal.hh'
          $source = [IO.File]::ReadAllText($header)
          if ($source.Contains('class Superluminal {')) {
            $source = $source.Replace('class Superluminal {', 'class JETSTREAM_API Superluminal {')
            [IO.File]::WriteAllText($header, $source, [Text.UTF8Encoding]::new($false))
          } elseif (!$source.Contains('class JETSTREAM_API Superluminal {')) {
            throw 'CyberEther Superluminal declaration changed; update the Windows export workaround.'
          }

          meson setup ce-src ce-build --vsenv `
            --prefix="${{ github.workspace }}/.ce-prefix" `
            -Dbuildtype=release `
            -Ddefault_library=shared `
            -Db_vscrt=static_from_buildtype `
            -Dpython=false -Dtests=false -Dexamples=false `
            -Dremote=disabled -Dinference=disabled
          meson compile -C ce-build
          meson install -C ce-build

      - name: Locate CyberEther artifacts
        shell: bash -el {0}
        run: |
          CE_PREFIX="${{ github.workspace }}/.ce-prefix"
          DLL=$(find "$CE_PREFIX" -name "jetstream.dll" | head -1)
          PC=$(find "$CE_PREFIX" -name "jetstream.pc" | head -1)
          if [[ -z "$DLL" || -z "$PC" ]]; then
            echo "missing artifacts under $CE_PREFIX (dll='$DLL' pc='$PC')"
            find "$CE_PREFIX" \( -name "*.dll" -o -name "*.lib" -o -name "*.pc" \) | head -30
            exit 1
          fi
          echo "JETSTREAM_DLL=$DLL" >> "$GITHUB_ENV"

          # pkgconf here is a native Windows build. Two traps:
          #  - it splits PKG_CONFIG_PATH on ';', and every path holds a
          #    drive-letter ':', so a Unix-style ':' join is unparseable
          #  - it treats '\' as an escape character, and github.workspace
          #    expands with backslashes, so the directory never resolves
          # Hence: a single directory, forward slashes only.
          PC_DIR=$(dirname "$PC")
          PC_DIR="${PC_DIR//\\//}"
          # Exported under our own name, not PKG_CONFIG_PATH: `conda activate`
          # runs at the start of every `bash -el` step and overwrites
          # PKG_CONFIG_PATH with the env's own, silently dropping anything set
          # here via GITHUB_ENV. The build step re-exports it post-activation.
          echo "JETSTREAM_PC_DIR=$PC_DIR" >> "$GITHUB_ENV"
          echo "found dll: $DLL"
          echo "found pc:  $PC"
          echo "pc dir:    $PC_DIR"

          # Prove the lookup works here rather than discovering it inside CMake.
          export PKG_CONFIG_PATH="$PC_DIR"
          echo "--- which pkg-config ---"; which pkg-config || true
          echo "--- default pc_path ---"; pkg-config --variable pc_path pkg-config || true
          echo "--- modversion ---"
          if ! pkg-config --modversion jetstream; then
            echo "pkg-config still cannot see jetstream; contents of $PC_DIR:"
            ls -la "$PC_DIR" || true
            echo "--- jetstream.pc ---"; cat "$PC" || true
            exit 1
          fi

      - name: Build gr-cyberether
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          # pkgconf is a native Windows executable and uses ';' between paths.
          $env:PKG_CONFIG_PATH = "$env:JETSTREAM_PC_DIR;$env:PKG_CONFIG_PATH"
          pkg-config --modversion jetstream

          # The hand-written bindings are current, but two stored header MD5s
          # predate their public-header changes. Refresh them in the runner so
          # GNU Radio 3.10's configure-time consistency check can proceed.
          $bindings = @(
            @('cyber_lineplot_sink', 'cyber_lineplot_sink'),
            @('cyber_waterfall_sink', 'cyber_waterfall_sink')
          )
          foreach ($pair in $bindings) {
            $binding = Join-Path $pwd "python/cyberether/bindings/$($pair[0])_python.cc"
            $header = Join-Path $pwd "include/gnuradio/cyberether/$($pair[1]).h"
            $hash = (Get-FileHash -Path $header -Algorithm MD5).Hash.ToLowerInvariant()
            $source = [IO.File]::ReadAllText($binding)
            $updated = [regex]::Replace(
              $source,
              '(BINDTOOL_HEADER_FILE_HASH\()[0-9a-fA-F]+(\))',
              "`${1}$hash`${2}",
              1)
            if ($updated -eq $source) {
              throw "Could not update the binding hash in $binding"
            }
            [IO.File]::WriteAllText($binding, $updated, [Text.UTF8Encoding]::new($false))
          }

          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist" `
            -DCMAKE_PREFIX_PATH="$env:CONDA_PREFIX/Library" `
            -DCMAKE_CXX_FLAGS="/Zc:preprocessor /DNOGDI /DBOOST_ALL_NO_LIB" `
            -DGR_PYTHON_DIR="Lib/site-packages" `
            -DPython_EXECUTABLE="$env:CONDA_PREFIX/python.exe" `
            -DENABLE_PYTHON=ON `
            -DENABLE_DOXYGEN=OFF
          cmake --build build
          cmake --install build

      - name: Bundle jetstream.dll
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path '${{ github.workspace }}/dist/bin' -Force | Out-Null
          Copy-Item -LiteralPath $env:JETSTREAM_DLL -Destination '${{ github.workspace }}/dist/bin/jetstream.dll'

      - name: Smoke test staged package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $pyd = Get-ChildItem -Path '${{ github.workspace }}/dist' `
            -Filter 'cyberether_python*.pyd' -File -Recurse | Select-Object -First 1
          if (!$pyd) {
            throw 'The staged package does not contain cyberether_python*.pyd'
          }

          $sitePackages = Split-Path (Split-Path $pyd.DirectoryName -Parent) -Parent
          $env:PYTHONPATH = "$sitePackages;$env:PYTHONPATH"
          $env:PATH = "${{ github.workspace }}/dist/bin;$env:CONDA_PREFIX/Library/bin;$env:PATH"

          & "$env:CONDA_PREFIX/python.exe" -c "from gnuradio import cyberether; b = cyberether.cyber_lineplot_sink_c(128, 'ci'); assert b.to_basic_block(); print('Windows package import: OK')"

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path '${{ github.workspace }}/dist/*' -DestinationPath gr-cyberether-windows-x86_64.zip

      # Manual runs: keep the ZIP as an artifact so it can be inspected
      # without publishing anything.
      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gr-cyberether-windows-x86_64
          path: gr-cyberether-windows-x86_64.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gr-cyberether-windows-x86_64.zip
